name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: windows-2025
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies and the package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Type check
        run: mypy
      - name: Tests (mocked plugs and website - no hardware needed)
        run: pytest -q
  deployment-scripts:
    name: Check deployment scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax and ShellCheck
        run: |
          for f in deployment/linux/*.sh; do sh -n "$f"; done
          shellcheck --severity=warning deployment/linux/*.sh
      - name: systemd unit
        run: systemd-analyze verify deployment/linux/tapo-collector.service 2>&1 | grep -v "is not executable" | (! grep .)
